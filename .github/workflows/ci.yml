name: API Node CI/CD (Fail Fast Pipeline)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast-and-build:
    name: 1. SAST & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Syntax
        run: |
          node --check index.js

      - name: Build Docker Image
        run: |
          docker build -t api-node:latest .

  lint-quality:
    name: 2. Code Quality & Lint
    runs-on: ubuntu-latest
    needs: [sast-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Code Quality
        run: |
          node --check index.js

  api-tests:
    name: 3. API E2E & Smoke Tests (Curl)
    runs-on: ubuntu-latest
    needs: [lint-quality]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Start API Node Server
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: notas_db
          PORT: 3000
        run: |
          npm start &
          sleep 5

      - name: Run API Smoke & Sanity Tests (Curl)
        run: |
          echo "=== 1. Smoke Test: Get /notas ==="
          curl -f http://localhost:3000/notas
          
          echo "=== 2. Sanity Test: Insert Grade ==="
          curl -X POST http://localhost:3000/notas \
            -H "Content-Type: application/json" \
            -d '{"aluno": "Aluno CI Teste", "disciplina": "DevOps", "nota": 9.5}'
